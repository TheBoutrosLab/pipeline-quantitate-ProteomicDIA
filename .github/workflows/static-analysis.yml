---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: TheBoutrosLab/tool-static-analysis@v1

  r-lintr:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install upstream lintr
        run: Rscript -e 'install.packages("lintr", repos = "https://cloud.r-project.org")'
      - name: Lint R scripts
        run: >-
          Rscript -e 'lints <- lintr::lint_dir("src");
          if (length(lints)) { print(lints); quit(status = 1L) }'
