global:
  temp_dir: work
  nf_config: test/global.config
  remove_temp: false
  clean_logs: true

cases:
  - name: test-integration-DIANN
    message: Quantify one DIA cohort against an EasyPQP library
    nf_script: main.nf
    nf_config: test/test-integration-DIANN/test.config
    skip: true
    verbose: true
  - name: test-integration-DIANN-fractionated
    message: Quantify two E. coli samples across three DIA fractions
    nf_script: main.nf
    nf_config: test/test-integration-DIANN-fractionated/test.config
    verbose: true
  - name: test-integration-DIANN-bruker
    message: Quantify one Bruker dia-PASEF .d acquisition against its EasyPQP library
    nf_script: main.nf
    nf_config: test/test-integration-DIANN-bruker/test.config
    verbose: true
  - name: test-integration-DIANN-predicted
    message: Quantify one DIA cohort against a predicted .speclib library
    nf_script: main.nf
    nf_config: test/test-integration-DIANN-predicted/test.config
    verbose: true
