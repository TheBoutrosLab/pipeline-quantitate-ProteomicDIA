---
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier used for output naming'
input_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV with exactly sample_name,mzML columns; one unfractionated DIA mzML per sample'
library_tsv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Cohort spectral library TSV from pipeline-generate-ProteomicSpectralLibrary'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Root output directory'
diann_qvalue:
  type: 'Number'
  default: 0.01
  help: 'Precursor q-value cutoff for DIA-NN main report; default 0.01'
diann_matrix_qvalue:
  type: 'Number'
  default: 0.01
  help: 'Matrix q-value cutoff for DIA-NN; default 0.01'
diann_fragment_interference_removal:
  type: Bool
  default: false
  help: 'Enable DIA-NN removal of interference from fragment elution curves; default false matches FragPipe'
docker_image_fragpipe:
  type: 'String'
  required: false
  help: 'Container with DIA-NN; default fcyucn/fragpipe:24.0'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow working directory; use scratch space for large DIA datasets'
apptainer_library:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Apptainer library directory'
apptainer_cache:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Apptainer cache directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'User-defined process memory and CPU adjustments'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
      help: 'Memory adjustments'
    cpus:
      type: 'ResourceUpdateList'
      required: false
      help: 'CPU adjustments'
resource_allocation_profile_tag:
  type: 'String'
  choices: ['default']
  default: 'default'
  help: 'Process-specific resource allocation profile'
