---
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier used for output naming'
input_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'CSV requiring sample_name and path columns; extra columns are allowed; one mzML file or Bruker .d directory per sample'
library:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'EasyPQP cohort library .tsv or DIA-NN .speclib; a .predicted.speclib requires FASTA'
fasta:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Source protein FASTA; required for .predicted.speclib'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Root output directory'
'DIA-NN':
  type: Namespace
  required: true
  help: 'DIA-NN command options; snake_case keys map directly to --kebab-case flags'
copy_inputs_to_work:
  type: 'Bool'
  required: false
  help: 'Copy staged acquisitions and reference files into the task work directory instead of symlinking them'
docker_image_pyopenms:
  type: 'String'
  required: false
  help: 'Container for EasyPQP TSV preparation; default ghcr.io/theboutroslab/pyopenms:3.5.0'
docker_image_fragpipe:
  type: 'String'
  required: false
  help: 'Container with DIA-NN; default fcyucn/fragpipe:24.0'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow working directory; use scratch space for large DIA datasets'
apptainer_library:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Apptainer library directory'
apptainer_cache:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Apptainer cache directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'User-defined process memory and CPU adjustments'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
      help: 'Memory adjustments'
    cpus:
      type: 'ResourceUpdateList'
      required: false
      help: 'CPU adjustments'
resource_allocation_profile_tag:
  type: 'String'
  choices: ['default']
  default: 'default'
  help: 'Process-specific resource allocation profile'
